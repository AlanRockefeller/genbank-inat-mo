[project]
name = "genbank-sequence-miner"
version = "0.1.0"
description = "Find iNaturalist and Mushroom Observer observation numbers in GenBank and check them against both sites"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
gim = "gim.cli:main"

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["gim"]
